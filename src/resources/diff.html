<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/diff2html.min.css">
<script src="vendor/diff2html.min.js"></script>
<style>
html, body {
  margin: 0;
  min-height: 100%;
  background: #ffffff;
  color: #1f2328;
  font-family: "Segoe UI", sans-serif;
}
#diff {
  padding: 16px;
}
.empty {
  padding: 24px;
  color: #57606a;
}
@media (prefers-color-scheme: dark) {
  html, body {
    background: #202020;
    color: #f0f0f0;
  }
  .d2h-wrapper {
    color: #f0f0f0;
  }
  .d2h-file-header, .d2h-code-side-linenumber, .d2h-code-linenumber {
    background: #292929;
    color: #b8b8b8;
    border-color: #404040;
  }
  .d2h-file-wrapper, .d2h-file-header, .d2h-code-wrapper {
    border-color: #404040;
  }
  .d2h-code-line, .d2h-code-side-line {
    background: #202020;
  }
}
</style>
</head>
<body>
<div id="diff"></div>
<script>
function renderDiff(diffText) {
  const target = document.getElementById('diff');
  if (!diffText) {
    target.className = 'empty';
    target.textContent = '没有差异';
    return;
  }
  target.className = '';
  target.innerHTML = Diff2Html.html(diffText, {
    drawFileList: false,
    matching: 'lines',
    outputFormat: 'side-by-side'
  });
}
</script>
</body>
</html>
